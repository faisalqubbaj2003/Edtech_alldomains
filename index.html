/* ══════════════════════════════════════════════════════════════════════════
   THE SHEET — the counselor's first viewport.
   One continuous ruled sheet, full bleed. The red margin rule down the left
   carries the tier stamp; names sit in the stub; the eight weeks are ruled
   columns of marks; the 07:04 sweep lands as a fresh column at the right
   edge. Everything the counselor is asked to read is one row.

   It replaced a greeting and three stat tiles. Those tiles counted meetings,
   follow-ups and deadlines — none of which answers the only question she
   opens this product to ask, which is who to see today. The sheet answers it
   by showing the runs and where they break, and it absorbs the old separate
   cohort matrix rather than making her hold two lists in her head.
   ══════════════════════════════════════════════════════════════════════════ */
const DAY={long:"Monday 24 November",short:"24 Nov",sweep:"07:04"};
/* Moved overnight, and opened overnight. Two different facts, both derived —
   the three-name array this replaced could not be filtered, sorted or counted,
   and drifted from the tiers it described. */
function movedToday(){return S.cases.filter(c=>c.prev&&c.prev!==c.prio);}
function openedToday(){return S.cases.filter(c=>!c.prev&&(c.opened||"").indexOf(DAY.short)===0);}

const TIER_ORDER=["urgent","checkin","review","monitor","good"];

/* The caseload's one filter. Real buttons with a pressed state, shared by the
   sheet and the priority list so a tier chosen on one holds across the other. */
function tierBar(){
 const pc=prioCounts();
 const tiers=[["all","All",S.cases.length]].concat(TIER_ORDER.map(t=>[t,PRIO[t].short,pc[t]]));
 return `<div class="tierbar" role="group" aria-label="Filter the caseload by triage tier">
  ${tiers.map(([k,l,n])=>{const on=S.sheetTier===k;
   return `<button type="button" class="tierbtn" data-tier="${k}" aria-pressed="${on}">
    ${k==="all"?'':tierMark(PRIO[k].mark,on?'currentColor':PRIO[k].c,12)}
    <span>${l}</span><span class="tierbtn-n" style="color:${on?'inherit':'var(--ink)'}">${n}</span>
    <span class="sr">${k==="all"?`all ${n} students`:`${n} in ${PRIO[k].label}`}</span></button>`;}).join('')}
 </div>`;}

function sheetList(){
 let l=S.cases.slice();
 if(S.sheetTier!=="all")l=l.filter(c=>c.prio===S.sheetTier);
 const q=(S.q||"").toLowerCase().trim();
 if(q)l=l.filter(c=>c.name.toLowerCase().includes(q)||(c.goal||"").toLowerCase().includes(q));
 /* Tier first, then the loudest run, then alphabetical. Within a tier an
    authored case outranks a quiet one — the quiet ones are collapsed anyway,
    and this keeps the order stable when they are expanded. */
 l.sort((a,b)=>PRIO[a.prio].order-PRIO[b.prio].order
  ||(a.roster?1:0)-(b.roster?1:0)
  ||runBreaks(b)-runBreaks(a)
  ||a.name.localeCompare(b.name));
 return l;}

/* The fresh column. What the sweep did to this row four hours ago. */
function sweepCell(c){
 if(c.prev&&c.prev!==c.prio){
  const F=PRIO[c.prev],T=PRIO[c.prio];
  return `<span class="lg-mv" style="color:${T.c}" title="Moved from ${F.label} to ${T.label} at the ${DAY.sweep} sweep">
   <span style="color:var(--ink-4)">${F.letter}</span>${ic('arrowR',10)}${T.letter}
   <span class="sr">Moved from ${F.label} to ${T.label} at the ${DAY.sweep} sweep</span></span>`;}
 if((c.opened||"").indexOf(DAY.short)===0)
  return `<span class="lg-new" title="Case opened at the ${DAY.sweep} sweep this morning">New<span class="sr">, case opened at the ${DAY.sweep} sweep this morning</span></span>`;
 return `<span title="No change at the ${DAY.sweep} sweep" style="display:grid;place-items:center">${runMark('none',11)}<span class="sr">No change</span></span>`;}

function sheetRow(c){
 const on=S.sel.indexOf(c.id)>=0;
 const run=weekRun(c);
 const P=PRIO[c.prio];
 /* The second printed line. For an open case it is the ask; for one of the
    quiet 72 there is no ask, so it is who they are. */
 const sub=c.roster?`${c.goal} · ${c.pred}`:c.action.what;
 return `<tr class="lgrow${on?' on':''}" data-rowfile="${c.id}">
  <td class="lg-sel"><button class="lg-selhit" data-sel="${c.id}">
   <span class="lg-box" role="checkbox" aria-checked="${on}" aria-label="Select ${c.name}">${on?ic('check',11):''}</span></button></td>
  <td class="lg-mgn"><span style="display:flex;align-items:center;gap:3px">${tierStamp(c.prio,13)}${c.seen?`<span title="Marked as seen today" style="color:var(--ink-4);display:flex">${ic('check',10)}<span class="sr">Marked as seen today</span></span>`:''}</span></td>
  <td class="lg-stub"><button class="lg-open" data-file="${c.id}">
   <span class="lg-name">${c.name}<span class="lg-yr">${c.yr.replace('Grade ','G')}</span></span>
   <span class="lg-sub">${sub}</span></button></td>
  ${run.map((w,i)=>`<td class="lg-wk" title="Week ${i+1}: ${RUNLABEL[w]}">${runMark(w,11)}<span class="sr">Week ${i+1}: ${RUNLABEL[w]}</span></td>`).join('')}
  <td class="lg-now">${sweepCell(c)}</td>
  <td class="lg-last"><span class="fig" style="font-size:11px;color:var(--ink-3)">${lastContactOf(c)}</span></td>
 </tr>`;}

const SHEET_CHUNK=25;
const SHEET_VIEWS=new Set(["cohort","today","cohort-schedule","cohort-all"]);
function vSheet(){
 const pc=prioCounts();
 const list=sheetList();
 const open=list.filter(c=>!c.roster), quiet=list.filter(c=>c.roster);
 const moved=movedToday().length, opened=openedToday().length;
 const need=pc.urgent+pc.checkin;
 const grouped=S.sheetTier==="all";

 /* Rows, in one continuous run. When no tier filter is applied the sheet
    prints a ruled group line where the tier changes; filtered, it does not,
    because there is only one tier left to announce. */
 let rows="",last=null;
 const emit=c=>{
  if(grouped&&c.prio!==last){
   last=c.prio;const P=PRIO[c.prio];
   rows+=`<tr class="lg-grp"><td class="lg-sel"></td><td class="lg-mgn"></td><td colspan="11">
    <div class="lg-grplab" style="color:${P.c}"><span>${P.label}</span>
     <span class="lg-grpsla">${P.sla}</span>
     <span class="lg-grpn">${pc[c.prio]} of ${S.cases.length}</span></div></td></tr>`;}
  rows+=sheetRow(c);};
 open.forEach(emit);
 if(quiet.length){
  if(grouped&&quiet[0].prio!==last){last=quiet[0].prio;const P=PRIO[quiet[0].prio];
   rows+=`<tr class="lg-grp"><td class="lg-sel"></td><td class="lg-mgn"></td><td colspan="11">
    <div class="lg-grplab" style="color:${P.c}"><span>${P.label}</span>
     <span class="lg-grpsla">${P.sla}</span>
     <span class="lg-grpn">${pc[quiet[0].prio]} of ${S.cases.length}</span></div></td></tr>`;}
  /* A real <table> gives content-visibility no layout containment on
     display:table-row, so 87 laid-out <tr> is the cost of expanding in one
     shot. Reveal in chunks instead — each tap lays out 25 more rows rather
     than all of them, and collapsing drops them from the DOM again. */
  const shown=Math.min(S.sheetRosterShown||0,quiet.length);
  const remaining=quiet.length-shown;
  rows+=`<tr class="lg-grp" style="background:var(--stock)"><td class="lg-sel"></td><td class="lg-mgn"></td><td colspan="11">
   <button class="lg-more" data-sheetroster="1" aria-expanded="${shown>0}">
    <span style="display:flex;transform:rotate(${shown>0?90:0}deg);transition:transform .18s cubic-bezier(.22,1,.36,1)">${ic('chevR',13)}</span>
    <span>${remaining>0?`Show ${Math.min(SHEET_CHUNK,remaining)} of ${remaining} more students · no open signal`:`Hide the ${quiet.length}`}</span>
    <span class="lg-morerule"></span></button></td></tr>`;
  quiet.slice(0,shown).forEach(c=>{rows+=sheetRow(c);});}

 const railBody=sheetRail();

 return `<div class="sheetpage fade">
 <div class="sheetmain">
  <div class="sheetcap">
   <h1>Caseload · ${DAY.long}</h1>
   <p>The engine swept ${S.cases.length} students at ${DAY.sweep}. ${moved===0&&opened===0?`Nothing moved overnight.`:`${moved} moved tier${opened?` and ${opened} opened`:''} overnight.`}
    <b style="color:var(--ink)">${need} need you today.</b>
    Each row is one student's last eight weeks against their own band: a mark for a week held, a cross for a week outside it.</p>
  </div>

  ${tierBar()}

  ${list.length?`<div class="sheetscroll"><table class="sheet ledger">
   <caption class="sr">The caseload, one row per student: triage tier, name, the last eight weeks measured against that student's own baseline band, and what the ${DAY.sweep} sweep changed this morning.</caption>
   <thead><tr>
    <th class="lg-sel"><span class="sr">Select</span></th>
    <th class="lg-mgn"><span class="sr">Triage tier</span></th>
    <th class="lg-stub">Student</th>
    ${WEEKS.map(w=>`<th class="lg-wk" scope="col">${w}</th>`).join('')}
    <th class="lg-now" scope="col">${DAY.sweep}</th>
    <th class="lg-last" scope="col">Last contact</th>
   </tr></thead>
   <tbody>${rows}</tbody></table></div>`
  :empty((S.q||"").trim()?`No student matches “${S.q}”`:`Nobody is in ${PRIO[S.sheetTier].label}`,
    (S.q||"").trim()
     ? `No name or goal on the sheet matches that${S.sheetTier==="all"?'':`, within ${PRIO[S.sheetTier].label}`}. All ${S.cases.length} students are still on the register. The search narrowed what is printed, not who is on it.`
     : `The ${DAY.sweep} sweep ran across all ${S.cases.length} students and put nobody in this tier. An empty tier means the engine found no one there, not that it found nothing.`,
    `<button class="btn btn-g btn-sm" data-tier="all">Show all ${S.cases.length}</button>`)}

  ${S.sel.length?`<div class="lg-bulk" role="region" aria-label="Actions for the selected students">
   <span class="lg-bulkn">${S.sel.length} selected</span>
   <button type="button" class="pri" data-bulkack="1">${ic('check',14)} Mark as seen</button>
   <button type="button" data-bulkassign="1">${ic('users',14)} Reassign…</button>
   <button type="button" data-selclear="1">${ic('x',14)} Clear</button>
   <span style="font-size:11.3px;color:rgba(255,255,255,.62);line-height:1.4;flex:1;min-width:180px">Both actions write a line into every selected student's record.</span>
  </div>`:''}
 </div>
 <aside class="sheetrail" aria-label="Today">${railBody}</aside>
</div>`;}

/* The day, beside the sheet. It used to be the whole landing screen, opened by
   a greeting and three tiles measuring nothing. It is real content — meetings,
   follow-ups and what the sweep changed — so it keeps its place, at the width
   its job actually needs. */
function sheetRail(){
 const due=S.ivs.filter(i=>i.status==="open");
 const moved=movedToday(), opened=openedToday();
 const meets=AGENDA.filter(a=>a.k==="meet");
 return `
 <div style="font-family:var(--f-apparatus);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)">${SCHOOL.short}</div>
 <div class="stamp" style="font-size:17px;font-weight:600;color:var(--ink);margin:3px 0 2px">${DAY.long}</div>
 <div class="fig" style="font-size:11px;color:var(--ink-3);margin-bottom:20px">Engine swept ${DAY.sweep} · ${meets.length} meetings · ${due.length} follow-ups</div>

 ${moved.length||opened.length?`<h2 class="railh">What changed overnight</h2>
 <div style="margin-bottom:22px">
  ${moved.map(c=>`<button class="railrow" data-file="${c.id}">
   <div style="display:flex;align-items:center;gap:7px">
    <span style="font-size:12.4px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>
    <span class="lg-mv" style="color:${PRIO[c.prio].c}"><span style="color:var(--ink-4)">${PRIO[c.prev].letter}</span>${ic('arrowR',10)}${PRIO[c.prio].letter}</span></div>
   <div style="font-size:11.3px;color:var(--ink-3);line-height:1.45;margin-top:2px">${c.movedWhy||PRIO[c.prio].label}</div></button>`).join('')}
  ${opened.map(c=>`<button class="railrow" data-file="${c.id}">
   <div style="display:flex;align-items:center;gap:7px">
    <span style="font-size:12.4px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>
    <span class="lg-new">New</span></div>
   <div style="font-size:11.3px;color:var(--ink-3);line-height:1.45;margin-top:2px">Opened at ${DAY.sweep} · ${PRIO[c.prio].label}</div></button>`).join('')}
 </div>`:''}

 <h2 class="railh">Your day</h2>
 <div style="margin-bottom:22px">
  ${AGENDA.map(a=>{const K=KIND[a.k];
   return `<button class="railrow" ${a.sid?`data-file="${a.sid}"`:a.go?`data-cnav="${a.go}"`:'data-toast="Nothing to open on this block"'} style="display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start">
    <span class="fig" style="font-size:11.5px;font-weight:600;color:var(--ink-2);padding-top:1px">${a.t}</span>
    <span style="min-width:0">
     <span style="display:block;font-size:12.3px;font-weight:600;color:var(--ink);line-height:1.35">${a.title}</span>
     <span style="display:block;margin-top:3px;color:${K.c}"><span style="font-family:var(--f-apparatus);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase">${K.l}</span>${a.loc?`<span style="font-size:11px;color:var(--ink-3)"> · ${a.loc}</span>`:''}</span></span>
   </button>`;}).join('')}
 </div>

 <h2 class="railh">Follow-ups due</h2>
 ${due.length?due.map(i=>`<button class="railrow" data-file="${i.sid}">
   <span style="display:block;font-size:12.3px;font-weight:600;color:var(--ink)">${i.student}</span>
   <span style="display:block;font-size:11.3px;color:var(--ink-3);line-height:1.45;margin-top:2px">${i.type} · due ${i.due}</span></button>`).join('')
 :empty("Nothing due today","Every open intervention has a follow-up date later in the week.")}

 <div style="margin-top:22px;padding-top:14px;border-top:1px solid var(--rule-2);font-size:11.4px;color:var(--ink-3);line-height:1.55">
  <b style="color:var(--ink-2)">A tier is temporary.</b> It reflects the evidence on file this morning, not a judgement about a child, and it changes as you add context or the run recovers.
  <div style="margin-top:10px"><button class="btn btn-g btn-sm" data-cnav="thresholds">${ic('gauge',13)} Tune thresholds</button></div>
 </div>`;}

/* ═══════════ MY COHORT — today's schedule + the caseload ═══════════ */
/* ═══════════════ TEACHER PORTAL ═══════════════
   The investor's core ask: after every lesson a teacher can flag or comment
   in seconds, and it lands on the counselor's dashboard. Structured but open. */
/* A class register only ever holds students from its own grade. c2 and c3
   used to mix in whichever named cases were convenient (a Grade 9 and a
   Grade 10 student inside a "Grade 11" class), because the roster and the
   label were never checked against each other. The caseload only authors
   one named Grade 10 student and three named Grade 11 students in total
   (s10; s11, s12, s17) — everyone else generated is Grade 12 — so c2 and c3
   stay small rather than padded with names that do not exist. */
const TEACHER={name:"Mr. J. Davies",subject:"Mathematics",av:"JD",
 classes:[
  {id:"c1",code:"12A/Ma1",label:"Grade 12 Mathematics: Analysis & Approaches HL",period:"P2",students:["s1","s2","s3","s4","s5","s6"],enrolled:6,avg:87},
  {id:"c2",code:"11B/Ma2",label:"Grade 11 Mathematics",period:"P4",students:["s11","s12","s17"],enrolled:3,avg:84},
  {id:"c3",code:"10C/Ma3",label:"Grade 10 Mathematics (Foundation)",period:"P6",students:["s10"],enrolled:1,avg:79}
 ]};

/* what a teacher can log — structured tags, then free text */
const FLAG_KINDS=[
 {k:"concern",l:"Raise a concern",short:"Concern",c:"var(--crit)",bg:"var(--crit-bg)",ic:"alert",
  tags:["Withdrawn / quiet","Appears tired","Distressed or upset","Sudden drop in work","Missing homework","Disengaged in class","Conflict with peers","Left lesson early"]},
 {k:"positive",l:"Log something positive",short:"Positive",c:"var(--ok)",bg:"var(--ok-bg)",ic:"trend",
  tags:["Notable improvement","Excellent contribution","Helped a peer","Recovered after support","Strong effort"]},
 {k:"note",l:"Add context",short:"Context",c:"var(--info)",bg:"var(--info-bg)",ic:"pencil",
  tags:["Family situation known","Authorised absence","Was ill","Extra support agreed","Spoke with them already"]}];

/* seeded log so the loop is visible immediately */
let TFLAGS=[
 {id:"tf1",sid:"s1",student:"Ahmed Khalifa",av:"AK",by:"Mr. J. Davies · Mathematics",kind:"concern",
  tags:["Withdrawn / quiet","Appears tired"],
  txt:"Unusually withdrawn over the last two weeks. Not engaging with group work, which is out of character. Appears tired.",
  when:"11 Nov · P2",status:"linked",routed:"Merged into Ahmed's open case · counselor notified"},
 {id:"tf2",sid:"s5",student:"Maryam Al Suwaidi",av:"MA",by:"Ms. Bianchi · Art",kind:"positive",
  tags:["Notable improvement","Strong effort"],
  txt:"Portfolio work has transformed since half term. Staying behind voluntarily to finish pieces.",
  when:"5 Nov · P4",status:"linked",routed:"Attached as a positive signal · supported case closure"}];

function tflagCounts(){return{concern:TFLAGS.filter(f=>f.kind==="concern").length,
 positive:TFLAGS.filter(f=>f.kind==="positive").length,note:TFLAGS.filter(f=>f.kind==="note").length};}

/* ── Teacher: what I've logged, and what happened next ──
   Ported from the Phase-4 lineage (39defe5). The teacher nav item routed here
   with no function defined, so draw() threw before writing R.innerHTML and the
   whole item was silently dead. Filters on the signed-in teacher rather than a
   hardcoded surname so it survives TEACHER changing. */
function vTLog(){
 const mine=TFLAGS.filter(f=>f.by.indexOf(TEACHER.name.split(" ").slice(-1)[0])>-1);
 return `<div class="fade">
 ${head("Every entry, and what happened next","A record of what you have raised this term and how the counselor acted on it, so nothing you flag disappears into a form you never hear back from.")}
 <div class="card" style="padding:16px 18px">
  ${mine.length?mine.map(f=>{
   const K=FLAG_KINDS.find(k=>k.k===f.kind)||FLAG_KINDS[0];
   const routed=f.routed?`<div style="font-size:11px;color:var(--ok);margin-top:5px;display:flex;align-items:center;gap:5px">${ic('checkC',12)} ${f.routed}</div>`
    :`<div style="font-size:11px;color:var(--ink-4);margin-top:5px;display:flex;align-items:center;gap:5px">${ic('clock',12)} With the counselor. You will be told what happened with it.</div>`;
   return `<div style="padding:11px 0;border-bottom:1px solid var(--line)">

    <div style="font-size:12px;color:var(--ink-2);line-height:1.5">${f.txt}</div>${routed}</div>`;
  }).join(''):`<div style="font-size:12.3px;color:var(--ink-3);line-height:1.6">Nothing logged yet this term. When you flag something from your register, it appears here with what the counselor did about it.</div>`}
 </div></div>`;}

/* ── Teacher: my classes overview ──
   Reference, not the landing — the register carries that job now. A row per
   class in the same sheet vocabulary the rest of the product reads, not a
   grid of cards with class size and average blown up into hero numbers no
   decision follows from; a teacher glancing here wants to find a class and

  </tr></thead>
  <tbody>
  ${TEACHER.classes.map(cls=>`<tr>
   <td><div style="font-weight:600;color:var(--ink)">${cls.label}</div><div style="font-size:11px;color:var(--ink-3);margin-top:1px">${cls.code}</div></td>
   <td class="fig">${cls.period}</td>
   <td class="num fig">${cls.enrolled}</td>
   <td class="num fig">${cls.avg}%</td>
   <td><button class="btn btn-g btn-sm" data-tclass="${cls.id}">${ic('users',13)} Open register</button></td>
  </tr>`).join('')}
  </tbody></table></div>
 </div>`;}

/* ── Teacher: my classes / register ── */
function vTClass(){
 const cls=TEACHER.classes.find(x=>x.id===S.tClass)||TEACHER.classes[0];
 const roster=cls.students.map(id=>g(id)).filter(Boolean);
 const surname=TEACHER.name.split(" ").slice(-1)[0];
 return `<div class="fade">
 ${head("After your lesson",cls.label+" · "+cls.period+". Tap a student to log something. It takes about fifteen seconds and goes straight to their counselor. You never chase anyone or fill in a form twice.")}
 <div class="card" style="padding:15px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <div style="width:34px;height:34px;border-radius:var(--r);background:var(--brand-3);display:grid;place-items:center;color:var(--brand-2);flex-shrink:0">${ic('checkC',17)}</div>
  <div style="flex:1;min-width:200px;font-size:12.3px;color:var(--ink-2);line-height:1.5">
   <b style="color:var(--ink)">Grades and attendance come from iSAMS automatically.</b> You are never asked to re-enter data the school already holds, only the thing a system cannot see.</div>
 </div>
 ${TEACHER.classes.length>1?`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px" role="tablist" aria-label="Class">
  ${TEACHER.classes.map(c=>`<button class="tab ${c.id===cls.id?'on':''}" data-tclass="${c.id}" role="tab" aria-selected="${c.id===cls.id}">${c.code}</button>`).join('')}
 </div>`:''}
 <div style="display:grid;gap:10px">
 ${roster.length?roster.map((c,i)=>{const mine=TFLAGS.filter(f=>f.sid===c.id);
  return `<div class="card lift" data-tflag="${c.id}" style="padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;animation:rise .35s ${i*.04}s backwards">
   ${av(c.av,"monitor",40)}
   <div style="min-width:0"><b style="font-size:13.5px">${c.name}</b>
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:1px">${cls.code}${mine.length?` · you logged ${mine.length} this term`:''}</div></div>
   <span class="btn btn-g btn-sm" style="pointer-events:none">${ic('plus',13)} Log</span>
  </div>`;}).join(''):`<div style="font-size:12.3px;color:var(--ink-3);line-height:1.6">No students on this register yet.</div>`}
 </div>
 <div class="card" style="padding:16px 18px;margin-top:16px">
  <h2 class="sechead">${ic('list',13)} What you have logged</h2>
  ${TFLAGS.filter(f=>f.by.indexOf(surname)>-1).map(f=>{

/* ═══════════════════════════════════════════════════════════════════
   STUDENT DISCOVERY SYSTEM — onboarding quiz, guided AI discovery,
   pathway proposals, counselor approval, gamified roadmap.
   ═══════════════════════════════════════════════════════════════════ */

/* Three taps, not nine open-ended paragraphs before a fifteen-year-old is
   shown a single thing. The depth this used to demand in a form is what the
   conversation on the very next screen exists to do, and does better; a gate
   only owes that conversation somewhere to start.

   Every option carries the tag the scoring engine wants, so a tap is a
   stronger signal than a paragraph the keyword matcher had to guess at — the
   three kept questions are also the three the engine weights most heavily
   (interests 2.5 per pick, drive 2, spark 2). Free text still scores through
   extractTag for any answer written before this change. */
const ONBOARD_Q=[
 {id:"interests",type:"multi",text:"What already interests you? Pick as many as apply.",
  opts:[["finance","Markets, investing, business"],["tech","Coding, AI, technology"],["science","Biology, chemistry, medicine"],["design","Art, design, architecture"],["writing","Writing, media, storytelling"],["people","Psychology, teaching, working with people"],["none","None of these yet, and that is a real answer"]]},
 {id:"drive",type:"pick",text:"When you have felt good at something, what were you doing?",
  opts:[["people","Leading people, or talking them round"],["building","Building or fixing something"],["analyzing","Solving a hard problem"],["creating","Making something out of nothing"]]},
 {id:"spark",type:"pick",text:"At 25, what would make you feel it had gone well?",
  opts:[["money","Earning seriously well"],["impact","Having changed something for people"],["mastery","Being excellent at one specific thing"],["freedom","Working on my own terms"]]}
];

/* Pathway archetypes — each with a real, visual, milestone-based roadmap. */
/* keyword extraction — turns a free-text answer into the same short tags the
   scoring engine already expects, so open answers feed the identical matching logic. */
const TAG_KEYWORDS={
 people:["lead","persuad","help","talk","convinc","connect","present","negotiat","team up","bring people","motivat"],
 building:["build","code","fix","construct","design","make ","create with","engineer","assembl","put together","tinker"],
 analyzing:["solve","puzzle","pattern","strateg","math","numbers","figure out","logic","calculat","plan","research"],
 creating:["writ","art","music","idea","imagin","story","invent","compos","paint","film","draw"],
 money:["money","rich","wealth","deal","salary","profit","financ","invest","business grow","earn a lot"],

function extractNarrow(text,candidates){return extractTag(text,candidates);}

function extractTag(text,candidates){
 if(!text)return null;
 const t=text.toLowerCase();
 let best=null,bestHits=0;
 candidates.forEach(tag=>{
  const kws=TAG_KEYWORDS[tag]||[];
  const hits=kws.filter(k=>t.includes(k)).length;
  if(hits>bestHits){bestHits=hits;best=tag;}
 });
 return best;
}

function scoreArchetypes(answers){
 const scores={};Object.keys(ARCHETYPES).forEach(k=>scores[k]=0);
 const bump=(key,amt)=>{Object.entries(ARCHETYPES).forEach(([k,a])=>{if(a.score[key])scores[k]+=a.score[key]*amt;});};
 /* A tapped option states its tag; free text still has to be read for one. */
 const driveTag=answers.driveTag||extractTag(answers.drive,["people","building","analyzing","creating"]);
 const sparkTag=answers.sparkTag||extractTag(answers.spark,["money","impact","mastery","freedom"]);
 const envTag=answers.envTag||extractTag(answers.env,["fast","steady","social","solo"]);
 if(driveTag)bump(driveTag,2);
 if(sparkTag)bump(sparkTag,2);
 if(envTag)bump(envTag,1.5);
 if(answers.interests)answers.interests.forEach(i=>bump(i,2.5));
 if(answers.risk!==undefined){if(answers.risk>65)bump("freedom",1.5);if(answers.risk<35)bump("steady",1.5);}
 if(answers.f1)bump(answers.f1==="Talking to people and solving their problems"?"people":answers.f1.includes("Building")?"building":answers.f1.includes("numbers")?"analyzing":"people",1.5);
 if(answers.f2)bump(answers.f2==="Give me the higher ceiling"?"freedom":answers.f2==="Clear map, please"?"steady":"mastery",1.5);
 if(answers.f3)bump(answers.f3==="What I've built"?"building":answers.f3==="Who I've helped"?"people":answers.f3==="What I've mastered"?"mastery":"analyzing",1);
 return Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

/* ═══ DEEP CHAT — free-text, many turns, references real academic data ═══

/* ═══ QUESTION BANKS — branch by what the student is actually trying to work out.

const OPENING_Q={id:"pathtype",text:()=>"Before anything else: what are you trying to work out here? Getting into a specific university, or a type of university (Ivy League, Russell Group, a particular tier), and what it takes to get there from where you are right now. Or landing a specific role or industry, and what you'd need to do through the rest of school and university to get there — grades, clubs, internships, spring weeks. Or both, and how they fit together. Tell me in your own words, and name anything specific you already have in mind."};

const UNIVERSAL_Q=[
 {id:"proudest",text:()=>"What's the most impressive thing you've ever built, organised, or achieved, school-related or not? Walk me through what you actually did."},

   :"Describe an ordinary Tuesday for a version of you that's happy at work. Where are you, who's around you, what are you actually doing?"}

/* ═══ ADAPTIVE LENGTH ═══ the conversation ends when it has enough, not at a fixed count */
const MIN_QUESTIONS=4,MAX_QUESTIONS=12,SIGNAL_THRESHOLD=8;
function answerSignal(text){
 if(!text)return 0;
 const words=text.trim().split(/\s+/).filter(Boolean).length;
 return Math.min(words/12,2.2);
}
function buildQueue(goalFocus){
 if(!goalFocus)return UNIVERSAL_Q.slice();
 if(goalFocus.focus==="university")return[...UNIVERSITY_Q,...UNIVERSAL_Q];
 if(goalFocus.focus==="industry")return[...INDUSTRY_Q,...UNIVERSAL_Q];
 return[...BOTH_Q,...UNIVERSITY_Q.slice(0,2),...INDUSTRY_Q.slice(0,2),...UNIVERSAL_Q];
}
const FALLBACK_DEEPEN=[
 {id:"more1",text:()=>"Is there anything about this that still feels unclear, even to you? Say it plainly if so."},

];


/* combines the survey-based ranking with additional signal scanned out of
   the deep chat's free-text answers, so the conversation genuinely refines
   the direction rather than just confirming the survey. */
function scoreWithChat(surveyAnswers,chatAnswers){
 const base=scoreArchetypes(surveyAnswers);
 if(!chatAnswers||!Object.keys(chatAnswers).length)return base;
 const allText=Object.values(chatAnswers).join(" ").toLowerCase();
 const bonus={};
 Object.keys(ARCHETYPES).forEach(k=>bonus[k]=0);
 Object.entries(TAG_KEYWORDS).forEach(([tag,kws])=>{
  const hits=kws.filter(kw=>allText.includes(kw)).length;
  if(hits){Object.entries(ARCHETYPES).forEach(([k,a])=>{if(a.score[tag])bonus[k]+=a.score[tag]*hits*0.6;});}
 });
 const combined={};base.forEach((k,i)=>combined[k]=(base.length-i)+bonus[k]);
 return Object.entries(combined).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

/* ═══ UNIVERSITY vs INDUSTRY FOCUS ═══
   A student aiming at one exact university needs a different roadmap from
   one aiming at one exact industry, and a different one again if they
   genuinely want both. This classifies which, from their own words. */
const KNOWN_UNIVERSITIES=["London School of Economics","LSE","University College London","UCL","Warwick","NYU Stern","NYU","Oxford","Cambridge","Imperial College","Imperial","Stanford","MIT","Harvard","Georgia Tech","Edinburgh","Bristol","Manchester","Bath","Yale","Princeton","Columbia","UC Berkeley","Berkeley","Waterloo","King's College","KCL","Khalifa University","American University of Sharjah","NYU Abu Dhabi"];
function classifyGoalFocus(text){
 if(!text)return{focus:"industry",university:null};
 const t=text.toLowerCase();
 let foundUni=null;
 for(const uni of KNOWN_UNIVERSITIES){
  const esc=uni.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(new RegExp("\\b"+esc+"\\b").test(t)){foundUni=uni;break;}
 }
 const bothWords=["both","either","can\'t separate","cant separate","equally","not sure which","hard to choose","need both"];
 const uniWords=["university","get into","that school","specific school","college","undergrad"];
 const industryWords=["industry","career","the job","field","work in","profession","sector"];
 if(bothWords.some(w=>t.includes(w)))return{focus:"both",university:foundUni};
 const hasUni=uniWords.some(w=>t.includes(w))||!!foundUni;
 const hasIndustry=industryWords.some(w=>t.includes(w));
 if(hasUni&&hasIndustry)return{focus:"both",university:foundUni};
 if(hasUni)return{focus:"university",university:foundUni};
 if(hasIndustry)return{focus:"industry",university:null};
 return{focus:foundUni?"university":"industry",university:foundUni};
}
/* reshapes a subpath's main route around the classified focus — swapping in
   a named university as the explicit destination, or keeping the multi-university
   industry framing, or combining both explicitly. */
function applyGoalFocus(detail,goalFocus){
 if(!goalFocus||goalFocus.focus==="industry"||!detail)return detail;
 const cloned=JSON.parse(JSON.stringify(detail));
 const uniStepIdx=cloned.main.steps.findIndex(s=>KNOWN_UNIVERSITIES.some(u=>s.t.includes(u)||(s.d&&s.d.includes(u)))||/university|degree/i.test(s.timeframe||"")||/\btarget\b.*(university|degree)|university application/i.test(s.t));
 if(goalFocus.focus==="university"&&goalFocus.university){
  cloned.main.title=`Getting into ${goalFocus.university} · ${cloned.main.title}`;
  if(uniStepIdx>=0){
   cloned.main.steps[uniStepIdx]={...cloned.main.steps[uniStepIdx],
    t:`Make ${goalFocus.university} the primary target`,
    d:`This is the named goal, so every choice from here (subjects, positioning, timing) is built around what ${goalFocus.university} specifically looks for, not just what the industry generally wants.`};
  }
 } else if(goalFocus.focus==="both"&&goalFocus.university){
  cloned.main.title=`${goalFocus.university} → ${cloned.main.title.split("—")[0].trim()}`;
  if(uniStepIdx>=0){
   cloned.main.steps[uniStepIdx]={...cloned.main.steps[uniStepIdx],
    t:`Target ${goalFocus.university} specifically, for this route`,
    d:`Both the university and the direction are fixed goals here, so the plan below is built around ${goalFocus.university}\'s own requirements for getting into this field.`};
  }
 }
 return cloned;
}

function currentChatQuestion(){
 const step=S.chatQStep||0;
 if(step===0)return OPENING_Q;
 const queue=S.chatQueue||[];
 const qIdx=step-1;
 if(qIdx<queue.length)return queue[qIdx];
 return FALLBACK_DEEPEN[(qIdx-queue.length)%FALLBACK_DEEPEN.length];
}
function chatIsDone(){
 const step=S.chatQStep||0;
 if(step<MIN_QUESTIONS)return false;
 if(step>=MAX_QUESTIONS)return true;
 return (S.signalScore||0)>=SIGNAL_THRESHOLD;
}

/* ═══ EXPLAINABILITY ═══ shows exactly which of the student's own words drove the match,
   rather than presenting the result as an unexplained verdict. */
function explainMatch(archKey,answers,chatAnswers){
 const a=ARCHETYPES[archKey];
 const reasons=[];
 const driveTag=answers.driveTag||extractTag(answers.drive,["people","building","analyzing","creating"]);
 if(driveTag&&a.score[driveTag])reasons.push({from:"What makes you feel capable",quote:answers.drive,signal:driveTag});
 const sparkTag=answers.sparkTag||extractTag(answers.spark,["money","impact","mastery","freedom"]);
 if(sparkTag&&a.score[sparkTag])reasons.push({from:"What would make 25 feel like it went well",quote:answers.spark,signal:sparkTag});
 const envTag=answers.envTag||extractTag(answers.env,["fast","steady","social","solo"]);
 if(envTag&&a.score[envTag])reasons.push({from:"The environment you described wanting",quote:answers.env,signal:envTag});
 if(answers.interests&&answers.interests.some(i=>a.score[i]))reasons.push({from:"An interest you flagged directly",quote:answers.interests.filter(i=>a.score[i]).join(", "),signal:null});
 const chatEntries=Object.entries(chatAnswers||{});
 chatEntries.forEach(([qid,text])=>{
  const t=(text||"").toLowerCase();
  Object.entries(TAG_KEYWORDS).forEach(([tag,kws])=>{
   if(a.score[tag]&&kws.some(kw=>t.includes(kw))&&reasons.length<6&&!reasons.some(r=>r.quote===text)){
    reasons.push({from:"Something you said in the conversation",quote:text,signal:tag});
   }
  });
 });
 return reasons.slice(0,4);
}
/* ═══ REAL ALUMNI CROSS-REFERENCE ═══ ties the discovered pathway back to
   actual students from this school. This is real precedent, not a fabricated
   success rate — every alumnus record here represents a genuine placement,
   so the honest signal is breadth and volume, not an invented percentage. */
const ARCHETYPE_TO_DEGREE={finance:"Economics",tech:"Computer Science",medicine:"Medicine",venture:"Business",design:null};
function alumniForArchetype(archKey){
 const degree=ARCHETYPE_TO_DEGREE[archKey];
 if(!degree)return[];
 return PATH_ALUMNI.filter(a=>a.degree===degree);
}
function pathwayPrecedent(archKey){
 const matches=alumniForArchetype(archKey);
 if(!matches.length)return null;
 return{total:matches.length,universities:[...new Set(matches.map(a=>a.uni))].length,
  countries:[...new Set(matches.map(a=>a.country))].length};
}
/* ═══ COHORT DISCOVERY ANALYTICS ═══ aggregate view across every student who has
   gone through discovery this year — the institutional-level intelligence that
   turns individual conversations into a pattern a school can actually act on. */
function discoveryCohortStats(){
 const all=[...PENDING_APPROVALS,...(PS_SUBMISSIONS.length?[]:[])];
 const withArchetypes=PENDING_APPROVALS.filter(p=>p.archetypes&&p.archetypes.length);
 const counts={};
 withArchetypes.forEach(p=>p.archetypes.forEach(a=>{counts[a]=(counts[a]||0)+1;}));
 const totalPicks=Object.values(counts).reduce((a,b)=>a+b,0);
 const focusCounts={university:0,industry:0,both:0,unset:0};
 withArchetypes.forEach(p=>{
  const f=p.goalFocus?p.goalFocus.focus:"unset";
  focusCounts[f]=(focusCounts[f]||0)+1;
 });
 return{
  studentsWithDiscovery:withArchetypes.length,
  archetypeCounts:Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({key:k,count:v,pct:totalPicks?Math.round(v/totalPicks*100):0})),
  focusCounts
 };
}

/* ═══ THE PROPOSALS ═══
   Three candidate paths, ruled as entries rather than stacked as coloured
   cards. The strongest match is stamped, not glowed: on a sheet the thing
   that matters carries a printed mark, and the other two stay legible beside
   it instead of being dimmed into runners-up. */
function vPathwayProposals(){
 const ranked=S.rankedArchetypes||scoreArchetypes(S.onbAnswers||{});
 const top3=ranked.slice(0,3);
 const selected=S.selectedArchetypes||[];

/* ═══════════ PERSONAL STATEMENT LAB ═══════════
   Compares a student's draft against aggregate patterns from successful
   applications to their target university — never literal reproduced essays,
   always anonymised, statistical pattern data. The AI's read is a starting
   point; nothing is final until the counselor has actually read it. */
/* Real applications don't work university-by-university — UCAS sends ONE
   statement to every UK choice, Common App sends ONE main essay to every US
   choice. So the benchmark, and the draft itself, is organised by system,
   with university-specific notes layered on top for the schools it actually covers. */
const APP_SYSTEM_BY_UNI={
 "London School of Economics":"UCAS","University College London":"UCAS","Warwick":"UCAS",
 "Imperial College London":"UCAS","University of Edinburgh":"UCAS","University of Bristol":"UCAS",
 "University of Manchester":"UCAS","University of Bath":"UCAS","University of Leeds":"UCAS",
 "King\'s College London":"UCAS","Coventry University":"UCAS","UCL Medical School":"UCAS",
 "NYU Stern (Abu Dhabi)":"CommonApp","NYU Abu Dhabi":"CommonApp","NYU Stern":"CommonApp",
 "Georgia Tech":"CommonApp","UC Berkeley":"CommonApp","Johns Hopkins":"CommonApp",
 "University of Chicago":"CommonApp","Boston University":"CommonApp",
 "Khalifa University":"Direct","American University of Sharjah":"Direct"};
function systemForUni(uniName){return APP_SYSTEM_BY_UNI[uniName]||"_generic";}

const PS_SYSTEMS={
 UCAS:{label:"UCAS",region:"UK universities",limit:"4,000 characters, roughly 550–600 words. One statement, sent to every UK university on your list.",
  focus:["Evidence of independent reading beyond the syllabus: a named book, paper, or thinker, not just \"I love this subject\"","A specific example analysed with real reasoning, not just described","Clear, direct writing, because UK admissions tutors read hundreds of these and reward clarity over flourish","Because one statement goes to every choice, it needs to work for the subject generally rather than leaning too hard on one university's specific programme"],
  weak:["Opening with a generic hook (\"From a young age…\", \"X is everywhere…\")","Listing achievements without explaining what was learned from them","Naming one specific university by name in a statement that goes to all five UCAS choices","Vague claims with no specific evidence behind them"],
  uniNotes:{
   "London School of Economics":"LSE specifically rewards independent reading and clear economic reasoning over polish. It is one of the more academically literal readers of this group.",
   "University College London":"UCL looks for genuine curiosity connected to specific course content, not just enthusiasm for the subject in general.",
   "Warwick":"Warwick particularly values strong quantitative reasoning shown through a real example, not just stated as a trait.",
   "Imperial College London":"Imperial reads for technical depth and precision; general enthusiasm carries less weight here than elsewhere.",
   "University of Manchester":"Manchester tends to reward breadth, favouring a statement that connects the subject to a wider range of interests.",
   "University of Bath":"Bath places real weight on demonstrated practical application, not just theoretical interest."}},
 CommonApp:{label:"Common App",region:"US-style universities",limit:"~650 words for the main essay. One essay, sent to every Common App university. Some add their own short supplemental questions on top.",
  focus:["A genuine personal narrative rather than a list of accomplishments, because US admissions read for voice first","Specific reflection on a real challenge or failure, not only success stories","Evidence of intellectual range beyond the intended major, which is valued here more than in UK applications","A clear narrative arc with a beginning, a turn, and a reflection, not a chronological list"],
  weak:["Writing what you think admissions wants to hear rather than something true and specific","No clear narrative arc, so it reads as disconnected paragraphs rather than one coherent story","Avoiding vulnerability, when US-style essays reward genuine reflection over a polished achievement list","Treating it like a UCAS statement: too much focus on the subject, not enough on you as a person"],
  uniNotes:{
   "NYU Stern (Abu Dhabi)":"NYU Abu Dhabi specifically values intellectual range beyond finance. Its holistic, small-cohort model rewards genuine curiosity outside the intended major.",
   "Georgia Tech":"Georgia Tech's supplemental questions carry real weight alongside the main essay; this analysis covers the main essay only.",
   "UC Berkeley":"Berkeley's own Personal Insight Questions are separate from the Common App essay, and worth preparing for distinctly."}},
 Direct:{label:"Direct application",region:"institution-specific",limit:"Check the format and limit for this specific university. It won't follow UCAS or Common App conventions.",
  focus:["A specific, concrete example rather than a general claim","Clear connection between what you've done and what you want to study","Direct addressing of what this specific institution offers"],
  weak:["Assuming UCAS or Common App conventions apply when they may not","Generic content not tailored to this institution's own application format"],
  uniNotes:{}},
 _generic:{label:"General",region:"not yet specified",limit:"Check the limit for this application. They vary significantly by country and system.",
  focus:["A specific, concrete example rather than a general claim","Clear connection between what you've done and what you want to study","A distinct voice: something only you could have written"],
  weak:["Generic opening lines that could apply to any applicant","Claims without evidence behind them","Trying to cover too much ground instead of going deep on one or two things"],
  uniNotes:{}}};

const CLICHE_OPENERS=["from a young age","ever since i was","for as long as i can remember","i have always been passionate","i am passionate about","the world of","in today's society","throughout history"];
/* ═══ ANALYSIS ENGINE ═══
   Real, checkable heuristics — word count, structure, cliché detection,
   self-focus ratio, concrete-detail density, university-specific relevance —
   combined into one detailed, honest report. This is pattern analysis,
   not a claim to genuinely understand the writing the way a human would. */
function analyzeStatement(text,systemKey,courseName,coveredUnis){
 const bm=PS_SYSTEMS[systemKey]||PS_SYSTEMS._generic;
 courseName=courseName||"your course";
 coveredUnis=coveredUnis||[];
 const clean=text.trim();
 const words=clean.split(/\s+/).filter(Boolean);
 const wordCount=words.length;
 const charCount=clean.length;
 const paras=clean.split(/\n\s*\n/).filter(p=>p.trim().length>0);
 const sentences=clean.split(/[.!?]+\s/).filter(s=>s.trim().length>3);
 const lower=clean.toLowerCase();

 const targetWords=systemKey==="CommonApp"?650:575;
 const lengthRatio=wordCount/targetWords;
 const lengthScore=lengthRatio>=0.85&&lengthRatio<=1.15?100:lengthRatio>=0.6&&lengthRatio<=1.4?70:40;

 const openingText=lower.slice(0,120);
 const clicheHit=CLICHE_OPENERS.find(c=>openingText.includes(c));
 const openingScore=clicheHit?35:85;

 const selfWords=(lower.match(/\b(i|my|me|myself)\b/g)||[]).length;
 const selfRatio=selfWords/Math.max(wordCount,1);
 const selfScore=selfRatio>=0.03&&selfRatio<=0.09?90:selfRatio<0.03?55:70;

 const numberHits=(clean.match(/\b\d+\b/g)||[]).length;
 const properNounHits=(clean.match(/\b[A-Z][a-z]{2,}\b/g)||[]).length;
 const concreteScore=Math.min(100,Math.round(((numberHits*8)+(properNounHits*2))/Math.max(paras.length,1)*10));

 const courseWords=courseName.toLowerCase().split(/\s+/).filter(w=>w.length>3);
 const courseNamed=courseWords.some(w=>lower.includes(w));
 const relevanceScore=courseNamed?85:50;

 // named-one-university-in-a-shared-statement check — a real UCAS/Common App mistake
 const otherUnisNamed=coveredUnis.length>1?coveredUnis.filter(u=>{
  const shortName=u.split(" ")[0];
  return shortName.length>3&&lower.includes(shortName.toLowerCase());
 }):[];

 const sentLens=sentences.map(s=>s.split(/\s+/).length);
 const avgLen=sentLens.reduce((a,b)=>a+b,0)/Math.max(sentLens.length,1);
 const variance=sentLens.reduce((a,b)=>a+Math.pow(b-avgLen,2),0)/Math.max(sentLens.length,1);
 const varietyScore=variance>15?85:variance>5?65:40;

 const structureScore=paras.length>=3?85:paras.length===2?60:35;

 const namedUniPenalty=otherUnisNamed.length?15:0;
 const overall=Math.max(0,Math.round((lengthScore*0.15+openingScore*0.2+selfScore*0.1+concreteScore*0.2+relevanceScore*0.15+varietyScore*0.1+structureScore*0.1))-namedUniPenalty);

 const sections=[
   {name:"Length & fit for the limit",score:lengthScore,detail:lengthScore===100?`Right in the target range for ${bm.limit}`:lengthScore===70?`Workable, but ${wordCount<targetWords?"noticeably shorter":"noticeably longer"} than the typical range, so it is worth tightening toward ${bm.limit}`:`This needs real work before submission: ${wordCount<targetWords?"far too short":"significantly over"} for ${bm.limit}`},
   {name:"Opening",score:openingScore,detail:clicheHit?`The opening currently starts with "${clicheHit}". That is one of the most common openings admissions readers see, and it costs attention in the first line rather than earning it.`:"The opening avoids the most common cliché patterns. A genuine, specific start is one of the highest-leverage things a statement can get right."},
   {name:"Self-focus and reflection",score:selfScore,detail:selfRatio<0.03?"Reads slightly impersonally, so it is worth checking whether the reflection on what you personally learned or thought is coming through clearly enough.":selfRatio>0.09?"Very self-focused in density, so make sure it's balanced with enough external evidence and specifics, not just internal reflection.":"A healthy balance between personal reflection and outward evidence."},
   {name:"Concrete detail",score:concreteScore,detail:concreteScore>=70?"Good use of specific, checkable detail: named things, numbers, real examples. That is what separates a memorable statement from a generic one.":concreteScore>=40?"Some specific detail present, but there's room to replace general claims with more named, checkable specifics.":"Currently reads as quite general. Naming specific books, projects, numbers, or moments would strengthen this considerably."},
   {name:courseName+" relevance",score:relevanceScore,detail:courseNamed?`Directly references ${courseName}, which helps ground the statement in the course being applied to.`:`Doesn't currently name ${courseName} or the specific course directly. Even one clear, well-placed mention helps an admissions reader see the fit.`},
   {name:"Sentence rhythm",score:varietyScore,detail:varietyScore>=85?"Good variation in sentence length, so this reads with a natural rhythm rather than feeling mechanical.":"Sentences are fairly uniform in length. Mixing in some shorter, punchier sentences alongside longer ones usually reads more naturally."},
   {name:"Structure",score:structureScore,detail:structureScore>=85?"Clearly organised into distinct sections, which suggests real planning went into this.":paras.length===2?"Only two paragraph breaks. Most strong statements have a clearer three-part shape: hook, development, forward-looking close.":"Currently reads as one continuous block. Breaking this into distinct sections would make the structure much easier to follow."}
 ];
 if(otherUnisNamed.length){
  sections.unshift({name:"Naming one university by name",score:100-namedUniPenalty*6,detail:`This statement is shared across every ${bm.label} choice on your list, but it names "${otherUnisNamed[0]}" specifically, so it is worth making that more general, since the same statement goes to all of them.`});
 }

 return{
  overall,wordCount,charCount,paraCount:paras.length,sections,
  benchmarkFocus:bm.focus,benchmarkWeak:bm.weak,limit:bm.limit,
  uniNotes:coveredUnis.map(u=>({uni:u,note:bm.uniNotes[u]})).filter(x=>x.note)
 };}

function groupUniversitiesBySystem(uniOptions){
 const groups={};
 uniOptions.forEach(u=>{const sys=systemForUni(u);(groups[sys]=groups[sys]||[]).push(u);});
 return groups;
}

function vPSLab(){
 const c=g(PARENT_ME);

 if(!S.psActiveSystem)return vPSOverview(c,uniOptions);
 const rec=S.psStatements[S.psActiveSystem];
 if(rec&&rec.submitted)return vPSSubmitted(c);
 if(rec&&rec.versions&&rec.versions.length&&S.psShowResults)return vPSResults(c,rec);
 return vPSEditor(c,rec);
}

 const bm=PS_SYSTEMS[S.psActiveSystem];

 const alumniAtTheseUnis=PATH_ALUMNI.filter(al=>unis.includes(al.uni));

let PS_SUBMISSIONS=[];
/* ═══ PERSONAL STATEMENT COHORT ANALYTICS ═══ turns individual reads into an
   institutional pattern — the kind of insight that only exists because every
   student's draft runs through the same consistent analysis. */
function psCohortStats(){
 const all=PS_SUBMISSIONS;
 if(!all.length)return null;
 const weaknessCounts={};
 all.forEach(sub=>{
  sub.analysis.sections.forEach(s=>{
   if(s.score<60){weaknessCounts[s.name]=(weaknessCounts[s.name]||0)+1;}
  });
 });
 const avgScore=Math.round(all.reduce((sum,s)=>sum+s.analysis.overall,0)/all.length);
 const uniCounts={};
 all.forEach(sub=>{uniCounts[sub.uni]=(uniCounts[sub.uni]||0)+1;});
 return{
  total:all.length,
  avgScore,
  topWeaknesses:Object.entries(weaknessCounts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([name,count])=>({name,count,pct:Math.round(count/all.length*100)})),
  byUniversity:Object.entries(uniCounts).sort((a,b)=>b[1]-a[1])
 };}

 }
 if(S.palOpen&&ev.key==="ArrowDown"){
  const list=S.palResults.length?S.palResults:palFilter(S.palQuery,S.role);

  palPaint(S.palQuery,S.role);
  ev.preventDefault();
  return;
 }
 if(S.palOpen&&ev.key==="ArrowUp"){
  const list=S.palResults.length?S.palResults:palFilter(S.palQuery,S.role);
  S.palActiveIndex=(S.palActiveIndex-1+Math.max(list.length,1))%Math.max(list.length,1);

  if(item){const act=item.action;const m=(act||"").match(/^nav:(.+)$/);if(m){const key=m[1];if(S.role==="counselor")S.cv=key;else if(S.role==="student")S.sv=key;else if(S.role==="parent")S.pv=key;else if(S.role==="teacher")S.tv=key;else if(S.role==="mentor")S.mv=key;S.palOpen=false;S.palQuery="";S.palActiveIndex=0;draw();palRestoreFocus();} else if(act&&act.startsWith("role:")){S.role=act.replace(/^role:/,"");S.palOpen=false;S.palQuery="";S.palActiveIndex=0;draw();palRestoreFocus();}}
  ev.preventDefault();
 }
});

(function seedSaraStatement(){

<!-- ═══════════ UX AUDIT OVERLAY — dev tool, not part of the product ═══════════
     Findings from a Web Interface Guidelines review. Only initializes on
     localhost/127.0.0.1 or with a ?debug query param — never for a real
     visitor on the deployed domain. Toggle with the button, bottom-right
     (once gated in). Flagged elements get a live colour-coded outline (pure CSS
     attribute selectors — they re-match automatically after every draw(), no
     hook into draw()/bind() needed); a side panel lists every finding with
     file:line and a "Locate" jump for anything on the current screen. Global
     issues that aren't tied to one element (missing headings, no skip link…)
     are listed with no outline — there's nothing to circle. Safe to delete
     this whole block; nothing else in the file references it. -->
<style>
 :root{--aud-icon:#D92D20;--aud-kbd:#DC6803;--aud-role:#6938EF;--aud-label:#175CD3}
 html.audit-on button[data-toast="Notifications are up to date"],
 html.audit-on button[data-q=""],
 html.audit-on button[data-mclose]{outline:2px dashed var(--aud-icon)!important;outline-offset:2px!important}
 html.audit-on tr[data-open],html.audit-on div[data-open],html.audit-on div[data-file],
 html.audit-on div[data-tflag],html.audit-on div[data-cpq],html.audit-on div[data-ctxpick]{
  outline:2px dashed var(--aud-kbd)!important;outline-offset:-2px!important}
 html.audit-on div[data-slot],html.audit-on div[data-step],
 html.audit-on div[data-task],html.audit-on div[data-earlystart]{
  outline:2px dashed var(--aud-role)!important;outline-offset:-2px!important}
 html.audit-on input[type="range"],html.audit-on #cpin,html.audit-on #cq,html.audit-on #tnote,
 html.audit-on #pmsg,html.audit-on #pmnote,html.audit-on #mnotes,html.audit-on #maction,
 html.audit-on #sref,html.audit-on #mstu{outline:2px dashed var(--aud-label)!important;outline-offset:2px!important}
 .audit-flash{animation:auditFlash 1s ease}
 @keyframes auditFlash{0%,100%{box-shadow:none}25%,55%{box-shadow:0 0 0 4px #fff,0 0 0 7px #111}}
 @media (prefers-reduced-motion:reduce){.audit-flash{animation-duration:.01ms}}

 #auditBtn{position:fixed;right:18px;bottom:18px;z-index:999997;display:flex;align-items:center;gap:7px;
  font:600 12.5px/1 var(--f-apparatus);letter-spacing:-.006em;color:#fff;background:#111;
  border:1px solid rgba(255,255,255,.14);border-radius:var(--r-pill);padding:11px 16px;cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.28);touch-action:manipulation}
 #auditBtn:hover{background:#242424}
 #auditBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
 #auditBtn .n{background:var(--aud-icon);border-radius:var(--r-pill);padding:1px 7px;font-weight:700}
 @media (max-width:820px),(max-height:540px) and (max-width:1000px){
  #auditBtn{bottom:calc(78px + env(safe-area-inset-bottom))}
 }

 #auditPanel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;z-index:999998;
  background:#fff;border-left:1px solid #E4E7EC;box-shadow:-12px 0 32px rgba(16,24,40,.18);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);
  font:13px/1.5 var(--f-content);color:#0C111D}
 #auditPanel.open{transform:none}
 @media (prefers-reduced-motion:reduce){#auditPanel{transition-duration:.01ms}}
 #auditPanel header{padding:16px 18px;border-bottom:1px solid #EAECF0;display:flex;align-items:center;gap:10px;flex-shrink:0}
 #auditPanel header h2{font-size:15px;font-weight:700;letter-spacing:-.012em;flex:1;min-width:0}
 #auditPanel header p{font-size:11.5px;color:#667085;margin-top:2px}
 #auditClose{background:#F2F4F7;border:1px solid #E4E7EC;border-radius:var(--r);width:28px;height:28px;
  cursor:pointer;display:grid;place-items:center;flex-shrink:0;touch-action:manipulation}
 #auditClose:hover{background:#E4E7EC}
 #auditClose:focus-visible{outline:2px solid #0E9384;outline-offset:2px}
 #auditBody{flex:1;overflow-y:auto;padding:6px 0 24px}
 .audit-sec{padding:14px 18px 4px}
 .audit-sec h3{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#98A2B3;margin-bottom:9px}
 .audit-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F2F4F7;align-items:flex-start}
 .audit-sw{width:9px;height:9px;border-radius:var(--r-dot);flex-shrink:0;margin-top:4px}
 .audit-row b{font-size:12.5px;font-weight:600;display:block}
 .audit-row .loc{font:500 11px/1.4 var(--f-figure);color:#667085;margin-top:2px}
 .audit-row .msg{font-size:12px;color:#475467;margin-top:3px;line-height:1.45}
 .audit-locate{margin-left:auto;flex-shrink:0;background:#fff;border:1px solid #D0D5DD;border-radius:var(--r-sm);
  padding:4px 9px;font:600 11px/1 inherit;color:#344054;cursor:pointer;touch-action:manipulation}
 .audit-locate:hover{background:#F9FAFB}
 .audit-locate:focus-visible{outline:2px solid #0E9384;outline-offset:1px}
 .audit-miss{font-size:11px;color:#DC6803;margin-top:4px}
 #auditTotals{padding:12px 18px;border-top:1px solid #EAECF0;font-size:11.5px;color:#667085;flex-shrink:0}
</style>
<script>
(function(){
 "use strict";
 var CATS={icon:{c:"var(--aud-icon)",label:"Icon buttons — missing aria-label"},
  kbd:{c:"var(--aud-kbd)",label:"Clickable div/tr — not keyboard-accessible"},
  role:{c:"var(--aud-role)",label:"Fake control — missing role/aria-checked/keyboard"},
  label:{c:"var(--aud-label)",label:"Form field — no <label>/aria-label"}};
 var LIVE=[
 ];
 var GLOBAL=[
 ];

 function svgEsc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

 function buildPanel(){
  var byCat={icon:[],kbd:[],role:[],label:[]};
  LIVE.forEach(function(f){byCat[f.cat].push(f)});
  var sections=Object.keys(CATS).map(function(k){
   var rows=byCat[k].map(function(f,i){
    return '<div class="audit-row" data-audit-idx="'+i+'" data-audit-cat="'+k+'">'+
     '<span class="audit-sw" style="background:'+CATS[k].c+'"></span>'+
     '<div style="flex:1;min-width:0"><b>'+svgEsc(f.msg)+'</b>'+
     '<div class="loc">'+svgEsc(f.loc)+'</div></div>'+
     '<button class="audit-locate" data-audit-locate="'+svgEsc(f.sel)+'">Locate</button></div>';
   }).join("");
   return '<div class="audit-sec"><h3 style="color:'+CATS[k].c+'">'+svgEsc(CATS[k].label)+' · '+byCat[k].length+'</h3>'+rows+'</div>';
  }).join("");
  var globalRows=GLOBAL.map(function(f){
   return '<div class="audit-row"><span class="audit-sw" style="background:#98A2B3"></span>'+
    '<div style="flex:1;min-width:0"><b>'+svgEsc(f.msg)+'</b><div class="loc">'+svgEsc(f.loc)+'</div></div></div>';
  }).join("");
  return sections+'<div class="audit-sec"><h3 style="color:#98A2B3">Structural / global · '+GLOBAL.length+'</h3>'+globalRows+'</div>';
 }

 function locate(sel){
  var el=document.querySelector(sel);
  var row=document.querySelector('[data-audit-locate="'+sel.replace(/"/g,'\\"')+'"]').closest(".audit-row");
  var old=row.querySelector(".audit-miss");if(old)old.remove();
  if(!el){
   var m=document.createElement("div");m.className="audit-miss";
   m.textContent="Not on the current screen — navigate there, then Locate again.";
   row.appendChild(m);return;
  }
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.remove("audit-flash");void el.offsetWidth;el.classList.add("audit-flash");
 }

 function toggle(on){
  document.documentElement.classList.toggle("audit-on",on);
  document.getElementById("auditPanel").classList.toggle("open",on);
  document.getElementById("auditBtn").setAttribute("aria-expanded",String(on));
 }

 var DEBUG_ON=location.hostname==="localhost"||location.hostname==="127.0.0.1"||/[?&]debug\b/.test(location.search);
 if(DEBUG_ON){
  document.addEventListener("DOMContentLoaded",init);
  if(document.readyState!=="loading")init();
 }
 function init(){
  if(document.getElementById("auditBtn"))return;
  var btn=document.createElement("button");
  btn.id="auditBtn";btn.type="button";btn.setAttribute("aria-expanded","false");
  btn.setAttribute("aria-controls","auditPanel");
  btn.innerHTML='UX Audit <span class="n">'+(LIVE.length+GLOBAL.length)+'</span>';
  document.body.appendChild(btn);

  var panel=document.createElement("aside");
  panel.id="auditPanel";panel.setAttribute("role","region");panel.setAttribute("aria-label","UX audit findings");
  panel.innerHTML='<header><div><h2>UX Audit</h2><p>Web Interface Guidelines · '+(LIVE.length+GLOBAL.length)+' findings</p></div>'+
   '<button id="auditClose" type="button" aria-label="Close audit panel">✕</button></header>'+
   '<div id="auditBody">'+buildPanel()+'</div>'+
   '<div id="auditTotals">Outlined = live on the page right now (if on this screen). Grey = structural, not tied to one element.</div>';
  document.body.appendChild(panel);

  btn.addEventListener("click",function(){toggle(!document.documentElement.classList.contains("audit-on"))});
  document.getElementById("auditClose").addEventListener("click",function(){toggle(false)});
  document.addEventListener("keydown",function(ev){
   if(ev.key==="Escape"&&document.documentElement.classList.contains("audit-on"))toggle(false);
  });
  document.addEventListener("click",function(ev){
   var t=ev.target.closest("[data-audit-locate]");
   if(t)locate(t.getAttribute("data-audit-locate"));
  });
 }
})();
</script>
</body>
